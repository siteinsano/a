<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Radar de Navegação</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    background: #020804;
    color: #477a52;
    font-family: monospace;
}

#radar {
    position: relative;
    width: 100vw;
    height: 100dvh;
    overflow: hidden;
    background:
        radial-gradient(
            ellipse at center,
            #0b1c10 0%,
            #061008 55%,
            #010402 100%
        );
}

/* Linhas discretas do radar */
#radar::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;

    background-image:
        linear-gradient(
            rgba(48, 92, 57, 0.045) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(48, 92, 57, 0.045) 1px,
            transparent 1px
        );

    background-size: 35px 35px;
}

/* Cabeçalho */
#header {
    position: absolute;
    top: 24px;
    left: 0;
    width: 100%;
    text-align: center;
    z-index: 3;
}

#title {
    font-size: 13px;
    letter-spacing: 4px;
    color: #477a52;
}

#status {
    margin-top: 10px;
    font-size: 10px;
    letter-spacing: 2px;
    color: #294e32;
}

/* Área do túnel */
#map {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

/* O túnel é contínuo e ultrapassa a tela */
#tunnel {
    fill: none;
    stroke: #102e19;
    stroke-width: 76;
    stroke-linecap: round;
    stroke-linejoin: round;
}

/* Linha de navegação */
#route {
    fill: none;
    stroke: #285a35;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 4 11;
}

/* Barco representado por um ponto */
#boat {
    fill: #a4ffb5;
    stroke: #4b9b62;
    stroke-width: 2;
    filter: drop-shadow(0 0 7px #58bd70);
}

/* Botão inicial */
#controls {
    position: absolute;
    bottom: 35px;
    left: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    z-index: 3;
}

#start {
    padding: 14px 24px;
    border: 1px solid #315c3b;
    background: #08150b;
    color: #72a980;
    font-family: monospace;
    font-size: 11px;
    letter-spacing: 3px;
    animation: blink 1.5s infinite;
    cursor: pointer;
}

#hint {
    font-size: 9px;
    letter-spacing: 2px;
    color: #294e32;
}

@keyframes blink {
    50% {
        opacity: 0.35;
    }
}
</style>
</head>

<body>

<div id="radar">

    <header id="header">
        <div id="title">RADAR DE NAVEGAÇÃO</div>
        <div id="status">SISTEMA EM ESPERA</div>
    </header>

    <svg id="map"
         viewBox="0 0 400 800"
         preserveAspectRatio="xMidYMid slice"
         aria-label="Radar com túnel de navegação">

        <!--
          O caminho começa fora da tela,
          faz curvas e continua além das bordas.
          Não há marcações de parada ou destino.
        -->

        <path id="tunnel"
            d="
            M 115 900
            C 115 800, 115 760, 165 700
            C 220 635, 305 615, 310 530
            C 315 455, 235 425, 175 390
            C 110 350, 65 315, 85 245
            C 105 180, 205 170, 250 115
            C 290 65, 275 10, 305 -100
            " />

        <path id="route"
            d="
            M 115 900
            C 115 800, 115 760, 165 700
            C 220 635, 305 615, 310 530
            C 315 455, 235 425, 175 390
            C 110 350, 65 315, 85 245
            C 105 180, 205 170, 250 115
            C 290 65, 275 10, 305 -100
            " />

        <circle id="boat"
                cx="115"
                cy="790"
                r="5" />

    </svg>

    <div id="controls">
        <button id="start" onclick="startJourney()">
            INICIAR CAMINHO
        </button>

        <div id="hint">
            AGUARDANDO INSTRUÇÕES
        </div>
    </div>

</div>

<script>
const route = document.getElementById("route");
const boat = document.getElementById("boat");
const statusText = document.getElementById("status");
const startButton = document.getElementById("start");
const hint = document.getElementById("hint");

let animation = null;
let startTime = null;
let running = false;

function startJourney() {
    if (running) return;

    running = true;
    startTime = performance.now();

    startButton.style.display = "none";
    hint.textContent = "NAVEGAÇÃO INICIADA";
    statusText.textContent = "SINAL DE NAVEGAÇÃO ATIVO";

    animation = requestAnimationFrame(moveBoat);
}

function moveBoat(now) {
    if (!running) return;

    const elapsed = now - startTime;

    // Animação de demonstração de 20 segundos.
    const duration = 20000;

    const progress = (elapsed % duration) / duration;

    const length = route.getTotalLength();
    const point = route.getPointAtLength(length * progress);

    boat.setAttribute("cx", point.x);
    boat.setAttribute("cy", point.y);

    animation = requestAnimationFrame(moveBoat);
}
</script>

</body>
</html>
