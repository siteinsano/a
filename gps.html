<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar de Navegação</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #020804;
    color: #4b9b62;
    font-family: monospace;
    overflow: hidden;
}

#radar {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    background: radial-gradient(
        ellipse,
        #102b18 0%,
        #06140b 55%,
        #010402 100%
    );
}

h2 {
    font-size: 16px;
    letter-spacing: 3px;
    font-weight: normal;
    text-align: center;
    margin: 8px;
}

#status {
    font-size: 11px;
    color: #397b4b;
    margin: 8px;
    text-align: center;
}

#timer {
    font-size: 11px;
    margin: 10px;
    color: #397b4b;
}

svg {
    width: min(90vw, 420px);
    height: 68vh;
    overflow: visible;
}

.tunnel {
    fill: none;
    stroke: #123d21;
    stroke-width: 75;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.route {
    fill: none;
    stroke: #286b3c;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 8 9;
}

#boat {
    fill: #a4ffb5;
    stroke: #55c978;
    stroke-width: 3;
    filter: drop-shadow(0 0 8px #65ff8a);
}

.marker {
    fill: none;
    stroke: #397b4b;
    stroke-width: 3;
    stroke-linecap: round;
}

#startButton,
#continueButton {
    background: #102b18;
    border: 1px solid #397b4b;
    color: #8edba0;
    padding: 14px 22px;
    font-family: monospace;
    letter-spacing: 2px;
    cursor: pointer;
}

#startButton {
    animation: blink 1.2s infinite;
}

@keyframes blink {
    50% {
        opacity: 0.35;
    }
}

#message {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(1, 6, 2, 0.97);
    z-index: 5;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 28px;
}

#message h1 {
    color: #70b982;
    font-size: 21px;
    letter-spacing: 3px;
    font-weight: normal;
}

#message p {
    color: #5b9b6b;
    font-size: 13px;
    line-height: 2;
    max-width: 340px;
}

#secretStar {
    display: none;
    position: fixed;
    top: 5px;
    right: 7px;
    color: #24472c;
    opacity: 0.12;
    cursor: pointer;
    font-size: 20px;
    padding: 12px;
    z-index: 100;
    user-select: none;
}

#secretStar:hover {
    opacity: 0.7;
}

#continueBox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 5, 2, 0.98);
    z-index: 99;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
    text-align: center;
    color: #4b9b62;
    padding: 25px;
}

#continueBox h2 {
    line-height: 1.8;
}

#continueButton {
    animation: blink 1.5s infinite;
}

@media (max-width: 350px) {
    h2 {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div id="radar">

    <h2>RADAR DE NAVEGAÇÃO</h2>
    <div id="status">SISTEMA EM ESPERA</div>

    <svg viewBox="0 0 400 900" id="map">

        <!-- Túnel -->
        <path class="tunnel"
            d="M290 870
               L290 700
               Q290 610 275 520
               Q265 430 210 385
               Q145 350 105 310
               Q85 270 90 210
               L100 130
               Q105 80 125 25" />

        <!-- Trajeto -->
        <path id="route" class="route"
            d="M290 870
               L290 700
               Q290 610 275 520
               Q265 430 210 385
               Q145 350 105 310
               Q85 270 90 210
               L100 130
               Q105 80 125 25" />

        <!-- Ponto de obstrução -->
        <g class="marker">
            <path d="M185 365 L245 425 M245 365 L185 425"/>
        </g>

        <!-- Parada final -->
        <g class="marker">
            <path d="M85 65 L145 125 M145 65 L85 125"/>
        </g>

        <!-- Barco representado por um ponto -->
        <circle id="boat" cx="290" cy="870" r="7"/>

    </svg>

    <button id="startButton" onclick="startPath()">
        INICIAR CAMINHO
    </button>

    <div id="timer">AGUARDANDO INÍCIO</div>

</div>

<!-- Avisos de parada -->
<div id="message">
    <h1 id="messageTitle"></h1>
    <p id="messageText"></p>
</div>

<!-- Estrela discreta -->
<div id="secretStar" onclick="revealContinue()">★</div>

<!-- Continuação -->
<div id="continueBox">
    <h2>CONEXÃO RESTABELECIDA</h2>
    <p>Uma nova rota está disponível.</p>

    <button id="continueButton" onclick="goToReturn()">
        CONTINUAR PROGRESSO
    </button>
</div>

<script>
const route = document.getElementById("route");
const boat = document.getElementById("boat");
const statusText = document.getElementById("status");
const timer = document.getElementById("timer");
const startButton = document.getElementById("startButton");
const message = document.getElementById("message");
const secretStar = document.getElementById("secretStar");
const continueBox = document.getElementById("continueBox");

const totalLength = route.getTotalLength();

// Proporção do trajeto até a primeira parada.
const firstStop = 0.52;

// Cada trecho dura 2 minutos e 30 segundos.
const duration = 150000;

let phase = 0;
let startTime = null;
let animationFrame = null;
let starTimer = null;

function moveBoat(progress) {
    const point = route.getPointAtLength(
        totalLength * progress
    );

    boat.setAttribute("cx", point.x);
    boat.setAttribute("cy", point.y);
}

function startPath() {
    if (phase !== 0) return;

    phase = 1;
    startButton.style.display = "none";
    statusText.textContent = "NAVEGAÇÃO EM ANDAMENTO";
    startTime = performance.now();

    animationFrame = requestAnimationFrame(animate);
}

function animate(now) {
    if (phase !== 1 && phase !== 2) return;

    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1);

    let position;

    if (phase === 1) {
        position = progress * firstStop;
    } else {
        position = firstStop +
            progress * (1 - firstStop);
    }

    moveBoat(position);

    const remaining = Math.max(
        0,
        Math.ceil((duration - elapsed) / 1000)
    );

    timer.textContent =
        "TEMPO RESTANTE: " +
        Math.floor(remaining / 60) + ":" +
        String(remaining % 60).padStart(2, "0");

    if (progress >= 1) {
        if (phase === 1) {
            obstructionStop();
        } else {
            finalStop();
        }

        return;
    }

    animationFrame = requestAnimationFrame(animate);
}

function showMessage(title, text) {
    document.getElementById("messageTitle").textContent = title;
    document.getElementById("messageText").textContent = text;
    message.style.display = "flex";
}

function obstructionStop() {
    phase = 0;
    startTime = null;

    statusText.textContent = "PERCURSO INTERROMPIDO";
    timer.textContent = "SINAL DE NAVEGAÇÃO INTERROMPIDO";

    showMessage(
        "CONSTRUÇÃO",
        "PASSAGEM IMPEDIDA. Por favor, acabe com a obstrução para prosseguir o caminho."
    );

    // O barco permanece parado até a estrela ser clicada.
    secretStar.style.display = "block";
}

function revealContinue() {
    // A estrela só libera a primeira parada.
    if (phase === 0 &&
        document.getElementById("messageTitle").textContent === "CONSTRUÇÃO") {

        message.style.display = "none";
        secretStar.style.display = "none";

        phase = 2;
        startTime = performance.now();

        statusText.textContent = "NAVEGAÇÃO RETOMADA";

        animationFrame = requestAnimationFrame(animate);
        return;
    }

    // Na parada final, a estrela revela o botão de continuação.
    if (phase === 3) {
        continueBox.style.display = "flex";
    }
}

function finalStop() {
    phase = 3;

    moveBoat(1);

    statusText.textContent = "PARADA OBRIGATÓRIA";
    timer.textContent = "NAVEGAÇÃO SUSPENSA";

    showMessage(
        "PARADA OBRIGATÓRIA",
        "O percurso foi interrompido. Aguarde novas instruções."
    );

    // A estrela só aparece após 60 segundos.
    starTimer = setTimeout(() => {
        secretStar.style.display = "block";
    }, 60000);
}

function goToReturn() {
    window.location.href = "volta.html";
}
</script>

</body>
</html>
