<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificação</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #030303;
    color: #a9a9a9;
    font-family: monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

#container {
    width: 90%;
    max-width: 420px;
    text-align: center;
}

h1 {
    font-size: 19px;
    letter-spacing: 4px;
    font-weight: normal;
    margin-bottom: 12px;
}

#description {
    font-size: 12px;
    color: #777;
    line-height: 1.8;
    margin-bottom: 25px;
}

button {
    font-family: monospace;
    cursor: pointer;
}

#start {
    background: #111;
    border: 1px solid #555;
    color: #ccc;
    padding: 15px 25px;
    letter-spacing: 3px;
    animation: blink 1.5s infinite;
}

@keyframes blink {
    50% {
        opacity: 0.35;
    }
}

#game {
    display: none;
}

    display: grid;
    grid-template-columns: repeat(3, 1fr);
